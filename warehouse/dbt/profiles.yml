payments:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../../warehouse.duckdb') }}"   # default is relative to warehouse/dbt
      schema: analytics
      threads: 4
      settings:
        TimeZone: UTC                # raw timestamps are naive UTC; don't reinterpret as local time
    bigquery:                        # Module 3 portability demo (BigQuery sandbox)
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'your-sandbox-project') }}"
      dataset: analytics
      location: US
      threads: 4

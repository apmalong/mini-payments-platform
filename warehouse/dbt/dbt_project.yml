name: payments
version: "1.0.0"
profile: payments

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

# ELT ledger for cost, efficiency and SLO metrics (macros/record_run_results.sql).
on-run-end:
  - "{{ record_run_results(results) }}"

models:
  payments:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table

seeds:
  payments:
    fx_rates:
      +column_types:
        currency: varchar
        rate_to_cad: decimal(12,6)

vars:
  # Module 5: which column classifications each role may read (see governance/pii_policy.yml).
  # `dbt run-operation create_role_views` builds a role_<name> schema of views per role.
  access_roles:
    analyst: {classifications: [internal], layers: [marts]}
    fraud_ops: {classifications: [internal, confidential, restricted], layers: [marts, staging]}

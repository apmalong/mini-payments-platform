# Module 10: AI gateway (LiteLLM proxy). Every LLM call from the platform goes through here, so
# keys, budgets, rate limits, logging and PII redaction are enforced in one place.
#
# Clients use the OpenAI-compatible API at http://localhost:4000 with a per-team virtual key
# (gateway/setup_keys.py). Set ANTHROPIC_API_KEY in .env for real calls; without it, requests
# that pass "mock_response" still exercise the whole gateway path.

model_list:
  - model_name: default                      # what clients ask for
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: fast                         # cheaper fallback
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

router_settings:
  fallbacks: [{default: [fast]}]             # provider outage or rate limit on the main model
  num_retries: 1

guardrails:
  - guardrail_name: pii-redaction
    litellm_params:
      guardrail: pii_guardrail.PiiRedaction  # gateway/pii_guardrail.py, mounted next to this file
      mode: pre_call
      default_on: true                       # applies to every request, not opt-in

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL      # virtual keys, budgets and spend logs (Postgres)
  store_prompts_in_spend_logs: true          # audit trail; stores the prompt after redaction

litellm_settings:
  drop_params: true

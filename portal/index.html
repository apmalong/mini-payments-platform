<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payments Platform · Local</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1c1b18; --muted: #6b6860; --line: #e4e1d8;
    --up: #1f8a4c; --down: #c2412d; --idle: #a8a49a; --accent: #2b5fd9; --code: #f0eee8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141412; --panel: #1d1d1a; --ink: #ecebe6; --muted: #9a978d; --line: #2e2d29;
      --up: #4cc38a; --down: #f0785f; --idle: #6b6860; --accent: #7aa2ff; --code: #26251f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .summary { color: var(--muted); font-variant-numeric: tabular-nums; }
  .summary b { color: var(--ink); }
  section { margin-top: 28px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
       margin: 0 0 10px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
          display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .top { display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--idle); }
  .dot.up { background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 20%, transparent); }
  .dot.down { background: var(--down); }
  .name { font-weight: 600; flex: 1; min-width: 0; }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { color: var(--accent); }
  .state { font-size: 12px; color: var(--muted); }
  .desc { color: var(--muted); margin: 0; }
  .links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
  .links a { color: var(--accent); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  code, .cmd { font: 12px/1.45 ui-monospace, "Cascadia Code", Consolas, monospace; }
  .cmd { background: var(--code); border-radius: 6px; padding: 7px 9px; display: flex; gap: 8px;
         align-items: flex-start; }
  .cmd span { flex: 1; overflow-x: auto; white-space: pre; }
  button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel);
           color: var(--ink); border-radius: 5px; padding: 1px 7px; cursor: pointer; flex: none; }
  button:hover { border-color: var(--accent); }
  .planned { opacity: 0.6; }
  .tag { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; color: var(--muted); }
  footer { margin-top: 36px; color: var(--muted); font-size: 12px; }

  .tabs { display: flex; gap: 4px; margin-top: 18px; border-bottom: 1px solid var(--line); }
  .tabs a { padding: 8px 14px; color: var(--muted); text-decoration: none; font-weight: 600;
            border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a:hover { color: var(--ink); }
  .tabs a.active { color: var(--ink); border-bottom-color: var(--accent); }

  .docs { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; margin-top: 20px; }
  @media (max-width: 760px) { .docs { grid-template-columns: 1fr; } }
  .doclist h2 { margin: 18px 0 6px; }
  .doclist a { display: block; padding: 4px 8px; border-radius: 6px; color: var(--ink); text-decoration: none;
               font-size: 13px; }
  .doclist a:hover { background: var(--code); }
  .doclist a.active { background: var(--panel); border: 1px solid var(--line); }

  .doc { margin-top: 20px; min-width: 0; max-width: 900px; line-height: 1.6; }
  .doc h1 { font-size: 22px; margin: 0 0 8px; }
  .doc h2 { font-size: 17px; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 32px 0 8px; }
  .doc h3 { font-size: 15px; margin: 22px 0 6px; }
  .doc a { color: var(--accent); }
  .doc code { background: var(--code); border-radius: 4px; padding: 1px 5px; }
  .doc pre { background: var(--code); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
  .doc pre code { padding: 0; background: none; }
  .doc table { border-collapse: collapse; display: block; overflow-x: auto; margin: 12px 0; font-size: 13px; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .doc th { background: var(--panel); }
  .doc .mermaid { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
                  margin: 14px 0; overflow-x: auto; text-align: center; }
  .doc .mermaid { cursor: zoom-in; position: relative; }
  .doc .mermaid svg { max-width: 100%; height: auto; }            /* fit the page by default */
  .doc .mermaid.zoomed { cursor: zoom-out; }
  .doc .mermaid.zoomed svg { max-width: none; }                    /* click: full size, scroll */
  .doc .mermaid::after { content: "click to enlarge"; position: absolute; right: 12px; bottom: 8px;
                         font-size: 11px; color: var(--muted); }
  .doc .mermaid.zoomed::after { content: "click to fit"; }
  .doc.wide { max-width: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>
<script src="https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
const { useEffect, useState } = React;
const html = htm.bind(React.createElement);
const ROOT = "C:\\projects\\test\\mini-payments-platform";

// check: URL probed for liveness (no-cors: any HTTP answer = up, connection refused = down).
// Services without an HTTP endpoint have no check and show their connection details instead.
const GROUPS = [
  { title: "Orchestration & warehouse", services: [
    { name: "Airflow", url: "http://localhost:8088", check: "http://localhost:8088/api/v2/monitor/health",
      desc: "payments_pipeline and fraud_model_training. No login.",
      links: [["DAGs", "http://localhost:8088/dags"]],
      start: `cd ${ROOT}\\orchestration; docker compose --env-file ../.env up -d` },
    { name: "dbt docs", url: "http://localhost:8081", check: "http://localhost:8081",
      desc: "Model docs, tests and lineage graph. Runs on demand.",
      start: `cd ${ROOT}\\warehouse\\dbt; uv run dbt docs generate --profiles-dir .; uv run dbt docs serve --profiles-dir . --port 8081` },
    { name: "DuckDB UI", url: "http://localhost:4213", check: "http://localhost:4213",
      desc: "SQL notebook over warehouse.duckdb. Pause Airflow first: DuckDB allows one writer.",
      start: `cd ${ROOT}\\warehouse\\dbt; uv run python -c "import duckdb; c=duckdb.connect('../../warehouse.duckdb'); c.execute('INSTALL ui; LOAD ui; CALL start_ui()'); input('Enter to stop')"` },
  ]},
  { title: "Streaming", services: [
    { name: "Redpanda Console", url: "http://localhost:8085", check: "http://localhost:8085",
      desc: "Topics, messages and consumer groups.",
      links: [["payments.transactions", "http://localhost:8085/topics/payments.transactions"]],
      start: "docker start mpp-redpanda mpp-redpanda-console" },
    { name: "Redpanda admin API", url: "http://localhost:9644/v1/status/ready", check: "http://localhost:9644/v1/status/ready",
      desc: "Broker health. Kafka clients use localhost:9092.",
      links: [["Schema registry", "http://localhost:18081/subjects"]],
      start: "docker start mpp-redpanda" },
    { name: "RedisInsight", url: "http://localhost:5540", check: "http://localhost:5540",
      desc: "Online feature store. Add database: host mpp-redis, port 6379.",
      start: "docker start mpp-redis mpp-redisinsight" },
    { name: "Feature consumer metrics", url: "http://localhost:8000/metrics", check: "http://localhost:8000/metrics",
      desc: "Events processed, duplicates, late, lag. Only while the consumer runs.",
      start: `cd ${ROOT}\\streaming; uv run python consumer.py --score-url http://127.0.0.1:8091/score` },
  ]},
  { title: "Machine learning", services: [
    { name: "MLflow", url: "http://localhost:5000", check: "http://localhost:5000/health",
      desc: "Experiment 'fraud' and the fraud model registry (champion / challenger).",
      links: [["Models", "http://localhost:5000/#/models/fraud"], ["Experiments", "http://localhost:5000/#/experiments"]],
      start: "docker start mpp-mlflow" },
  ]},
  { title: "Kubernetes (kind cluster 'payments')", services: [
    { name: "Fraud scorer on Kubernetes", url: "http://localhost:8091/docs", check: "http://localhost:8091/readyz",
      desc: "Helm release fraud-scorer in namespace fraud: 2-5 pods behind a NodePort, autoscaled on CPU.",
      links: [["Ready", "http://localhost:8091/readyz"], ["Metrics", "http://localhost:8091/metrics/"]],
      start: `cd ${ROOT}\\k8s; kind create cluster --config kind.yaml; kind load docker-image fraud-scorer:local --name payments; helm upgrade --install fraud-scorer helm/fraud-scorer -n fraud --create-namespace --wait` },
  ]},
  { title: "Observability", services: [
    { name: "Grafana", url: "http://localhost:3000", check: "http://localhost:3000/api/health",
      desc: "Dashboard 'Payments platform': freshness, scoring SLOs, streaming, drift, alerts. No login.",
      links: [["Dashboard", "http://localhost:3000/d/payments-platform"]],
      start: "docker start mpp-grafana" },
    { name: "Prometheus", url: "http://localhost:9090", check: "http://localhost:9090/-/ready",
      desc: "Runs in the kind cluster; bridged to localhost:9090. Alert rules and SLO recording rules.",
      links: [["Alerts", "http://localhost:9090/alerts"], ["Targets", "http://localhost:9090/targets"]],
      start: "docker start mpp-prometheus-port" },
    { name: "Freshness & drift exporter", url: "http://localhost:8001/metrics", check: "http://localhost:8001/metrics",
      desc: "Data age per layer (source, raw, mart) and feature PSI vs training data.",
      start: `cd ${ROOT}\\observability; uv run python exporter.py` },
  ]},
  { title: "Planned", planned: true, services: [
    { name: "LiteLLM gateway", url: "http://localhost:4000/ui", module: "Module 10", desc: "AI gateway: keys, budgets, routing." },
  ]},
];

const DATA_STORES = [
  ["Postgres (source)", "localhost:5433", "user/password payments · db payments, airflow", "docker start mpp-postgres"],
  ["Kafka API (Redpanda)", "localhost:9092", "topic payments.transactions, 3 partitions", "docker start mpp-redpanda"],
  ["Redis (online features)", "localhost:6379", "features:card:<token>, merchant:<id>:amount_stats", "docker start mpp-redis"],
  ["DuckDB warehouse", `${ROOT}\\warehouse.duckdb`, "schemas raw, analytics, role_analyst, role_fraud_ops", null],
];

async function probe(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 3000);
  try {
    await fetch(url, { mode: "no-cors", cache: "no-store", signal: controller.signal });
    return "up";
  } catch {
    return "down";
  } finally {
    clearTimeout(timer);
  }
}

function useStatuses() {
  const [statuses, setStatuses] = useState({});
  const [checkedAt, setCheckedAt] = useState(null);
  useEffect(() => {
    const services = GROUPS.flatMap(g => g.services).filter(s => s.check);
    let stopped = false;
    const run = async () => {
      const results = await Promise.all(services.map(async s => [s.name, await probe(s.check)]));
      if (!stopped) { setStatuses(Object.fromEntries(results)); setCheckedAt(new Date()); }
    };
    run();
    const id = setInterval(run, 15000);
    return () => { stopped = true; clearInterval(id); };
  }, []);
  return [statuses, checkedAt];
}

function Copy({ text }) {
  const [label, setLabel] = useState("Copy");
  const copy = async () => {
    try { await navigator.clipboard.writeText(text); setLabel("Copied"); }
    catch { setLabel("Blocked: select the text"); }  // clipboard needs http://localhost, not file://
    setTimeout(() => setLabel("Copy"), 2000);
  };
  return html`<button onClick=${copy} title="Copy command">${label}</button>`;
}

function ServiceCard({ service, status, planned }) {
  const state = planned ? "planned" : status || "checking";
  const label = { up: "running", down: "not running", checking: "checking…", planned: service.module }[state];
  return html`
    <div class=${"card" + (planned ? " planned" : "")}>
      <div class="top">
        <span class=${"dot " + (state === "up" || state === "down" ? state : "")}></span>
        <span class="name">${planned ? service.name : html`<a href=${service.url} target="_blank" rel="noopener">${service.name}</a>`}</span>
        <span class=${planned ? "tag" : "state"}>${label}</span>
      </div>
      <p class="desc">${service.desc}</p>
      ${!planned && html`<div class="links">
        <a href=${service.url} target="_blank" rel="noopener">${service.url.replace("http://", "")}</a>
        ${(service.links || []).map(([text, href]) => html`<a key=${href} href=${href} target="_blank" rel="noopener">${text}</a>`)}
      </div>`}
      ${state === "down" && service.start && html`<div class="cmd"><span>${service.start}</span><${Copy} text=${service.start} /></div>`}
    </div>`;
}

// ---------- docs (served read-only from docs/ by portal/serve.py) ----------

const DARK = window.matchMedia("(prefers-color-scheme: dark)").matches;
// Mermaid measures label text to size boxes; give it the page's font or titles overflow.
const PAGE_FONT = 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif';
mermaid.initialize({
  startOnLoad: false, securityLevel: "strict", theme: DARK ? "dark" : "neutral",
  fontFamily: PAGE_FONT, themeVariables: { fontFamily: PAGE_FONT, fontSize: "14px" },
});

function resolvePath(base, href) {
  const parts = base.split("/").slice(0, -1);
  for (const part of href.split("/")) {
    if (part === "..") parts.pop(); else if (part !== ".") parts.push(part);
  }
  return parts.join("/");
}

// Render a docs/ Markdown file: internal .md links stay in the portal, links to code files
// (which the server doesn't serve) become plain paths, and mermaid blocks become diagrams.
function DocView({ path, wide = false }) {
  const [state, setState] = useState({ status: "loading", html: "" });
  const ref = React.useRef(null);
  useEffect(() => {
    let cancelled = false;
    setState({ status: "loading", html: "" });
    fetch(`/docs/${path}`)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
      .then(md => !cancelled && setState({ status: "ok", html: marked.parse(md) }))
      .catch(e => !cancelled && setState({ status: "error", html: String(e) }));
    return () => { cancelled = true; };
  }, [path]);
  useEffect(() => {
    const root = ref.current;
    if (!root || state.status !== "ok") return;
    root.querySelectorAll("a[href]").forEach(a => {
      const href = a.getAttribute("href");
      if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
      if (href.startsWith("#")) return;
      const [file] = href.split("#");
      if (file.endsWith(".md")) { a.setAttribute("href", `#docs/${resolvePath(path, file)}`); return; }
      const code = document.createElement("code");
      code.textContent = a.textContent;
      code.title = `In the repository: ${resolvePath("docs/" + path, file)}`;
      a.replaceWith(code);
    });
    const blocks = [...root.querySelectorAll("pre > code.language-mermaid")].map(code => {
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
      return div;
    });
    blocks.forEach(div => div.addEventListener("click", () => div.classList.toggle("zoomed")));
    if (blocks.length) mermaid.run({ nodes: blocks }).catch(e => console.error("mermaid", e));
    window.scrollTo(0, 0);
  }, [state]);
  if (state.status === "loading") return html`<p class="desc">Loading ${path}…</p>`;
  if (state.status === "error") return html`<p class="desc">Couldn't load docs/${path} (${state.html}). Is the portal running through <code>portal/serve.py</code>?</p>`;
  return html`<article class=${"doc" + (wide ? " wide" : "")} ref=${ref} dangerouslySetInnerHTML=${{ __html: state.html }}></article>`;
}

function DocsView({ path }) {
  const [index, setIndex] = useState([]);
  useEffect(() => { fetch("/docs/index.json").then(r => r.json()).then(setIndex).catch(() => setIndex([])); }, []);
  const groups = [...new Set(index.map(d => d.group))];
  const current = path || "governance.md";
  return html`
    <div class="docs">
      <nav class="doclist">
        ${groups.map(g => html`
          <div key=${g}>
            <h2>${g}</h2>
            ${index.filter(d => d.group === g).map(d => html`
              <a key=${d.path} href=${"#docs/" + d.path} class=${d.path === current ? "active" : ""}>${d.title}</a>`)}
          </div>`)}
      </nav>
      <${DocView} path=${current} />
    </div>`;
}

function useRoute() {
  const read = () => window.location.hash.replace(/^#/, "") || "services";
  const [route, setRoute] = useState(read);
  useEffect(() => {
    const onChange = () => setRoute(read());
    window.addEventListener("hashchange", onChange);
    return () => window.removeEventListener("hashchange", onChange);
  }, []);
  return route;
}

function App() {
  const route = useRoute();
  const [statuses, checkedAt] = useStatuses();
  const checked = Object.values(statuses);
  const up = checked.filter(s => s === "up").length;
  const tab = route.startsWith("docs") ? "docs" : route === "architecture" ? "architecture" : "services";
  return html`
    <main>
      <header>
        <h1>Payments platform · local</h1>
        <span class="summary">
          ${checkedAt ? html`<b>${up}</b> of ${checked.length} web services up · checked ${checkedAt.toLocaleTimeString()}` : "checking services…"}
        </span>
      </header>
      <nav class="tabs">
        <a href="#services" class=${tab === "services" ? "active" : ""}>Services</a>
        <a href="#architecture" class=${tab === "architecture" ? "active" : ""}>Architecture</a>
        <a href="#docs" class=${tab === "docs" ? "active" : ""}>Docs</a>
      </nav>
      ${tab === "architecture" && html`<${DocView} path="architecture.md" wide=${true} />`}
      ${tab === "docs" && html`<${DocsView} path=${route.replace(/^docs\/?/, "")} />`}
      ${tab === "services" && html`<${ServicesView} statuses=${statuses} />`}
    </main>`;
}

function ServicesView({ statuses }) {
  return html`
    <div>
      ${GROUPS.map(group => html`
        <section key=${group.title}>
          <h2>${group.title}</h2>
          <div class="grid">
            ${group.services.map(s => html`<${ServiceCard} key=${s.name} service=${s} status=${statuses[s.name]} planned=${group.planned} />`)}
          </div>
        </section>`)}
      <section>
        <h2>Data stores (no web UI)</h2>
        <div class="grid">
          ${DATA_STORES.map(([name, address, detail, start]) => html`
            <div class="card" key=${name}>
              <div class="top"><span class="name">${name}</span></div>
              <div class="cmd"><span>${address}</span><${Copy} text=${address} /></div>
              <p class="desc">${detail}</p>
              ${start && html`<p class="desc">Start: <code>${start}</code></p>`}
            </div>`)}
        </div>
      </section>
      <footer>
        Status checks run every 15 s from this page. Serve it with
        <code>uv run python portal/serve.py</code> from the project folder and open
        http://localhost:8099: the browser allows the checks, and the Architecture and Docs tabs
        read docs/ through it.
      </footer>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>

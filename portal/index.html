<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payments Platform · Local</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1c1b18; --muted: #6b6860; --line: #e4e1d8;
    --up: #1f8a4c; --down: #c2412d; --idle: #a8a49a; --accent: #2b5fd9; --code: #f0eee8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141412; --panel: #1d1d1a; --ink: #ecebe6; --muted: #9a978d; --line: #2e2d29;
      --up: #4cc38a; --down: #f0785f; --idle: #6b6860; --accent: #7aa2ff; --code: #26251f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .summary { color: var(--muted); font-variant-numeric: tabular-nums; }
  .summary b { color: var(--ink); }
  section { margin-top: 28px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
       margin: 0 0 10px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
          display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .top { display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--idle); }
  .dot.up { background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 20%, transparent); }
  .dot.down { background: var(--down); }
  .name { font-weight: 600; flex: 1; min-width: 0; }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { color: var(--accent); }
  .state { font-size: 12px; color: var(--muted); }
  .desc { color: var(--muted); margin: 0; }
  .links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
  .links a { color: var(--accent); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  code, .cmd { font: 12px/1.45 ui-monospace, "Cascadia Code", Consolas, monospace; }
  .cmd { background: var(--code); border-radius: 6px; padding: 7px 9px; display: flex; gap: 8px;
         align-items: flex-start; }
  .cmd span { flex: 1; overflow-x: auto; white-space: pre; }
  button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel);
           color: var(--ink); border-radius: 5px; padding: 1px 7px; cursor: pointer; flex: none; }
  button:hover { border-color: var(--accent); }
  .planned { opacity: 0.6; }
  .tag { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; color: var(--muted); }
  footer { margin-top: 36px; color: var(--muted); font-size: 12px; }

  .dot.idle { background: var(--idle); }
  .dot.checking { background: var(--idle); opacity: 0.5; }
  :root { --st-up: #0ca30c; --st-partial: #fab219; --st-down: #d03b3b; --st-none: #e1e0d9; }
  @media (prefers-color-scheme: dark) { :root { --st-none: #383835; } }
  .status-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
                     gap: 10px 20px; margin-top: 20px; }
  .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .segmented button { border: 0; border-radius: 0; padding: 5px 12px; background: var(--panel); }
  .segmented button + button { border-left: 1px solid var(--line); }
  .segmented button.active { background: var(--accent); color: #fff; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .sw.up, .bar.up { background: var(--st-up); }
  .sw.partial, .bar.partial { background: var(--st-partial); }
  .sw.down, .bar.down { background: var(--st-down); }
  .sw.none, .bar.none { background: var(--st-none); }
  .sw.off, .bar.off { background: var(--idle); }
  .status-row { display: grid; grid-template-columns: 220px minmax(0, 1fr) 56px; align-items: center;
                gap: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .status-name { font-weight: 600; min-width: 0; line-height: 1.35; }
  .bars { display: flex; gap: 2px; height: 26px; min-width: 0; }
  .bar { flex: 1 1 0; min-width: 2px; border-radius: 2px; }
  .bar:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
  .uptime { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .axis { display: grid; grid-template-columns: 220px minmax(0, 1fr) 56px; gap: 14px; color: var(--muted);
          font-size: 12px; margin-top: 6px; }
  .axis span:first-child { grid-column: 2; }
  .axis span:last-child { grid-column: 2; justify-self: end; }
  @media (max-width: 640px) {
    .status-row, .axis { grid-template-columns: minmax(0, 1fr) 48px; }
    .status-name { grid-column: 1 / -1; }
    .axis span:first-child, .axis span:last-child { grid-column: 1; }
  }
  .tooltip { position: fixed; z-index: 10; pointer-events: none; background: var(--panel); color: var(--ink);
             border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px;
             box-shadow: 0 4px 16px rgba(0,0,0,0.15); max-width: 320px; }
  .tooltip-error { color: var(--muted); margin-top: 4px; word-break: break-word; }

  .tabs { display: flex; gap: 4px; margin-top: 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs a { flex: none; }
  .tabs a { padding: 8px 14px; color: var(--muted); text-decoration: none; font-weight: 600;
            border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a:hover { color: var(--ink); }
  .tabs a.active { color: var(--ink); border-bottom-color: var(--accent); }

  .docs { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; margin-top: 20px; }
  @media (max-width: 760px) { .docs { grid-template-columns: 1fr; } }
  .doclist h2 { margin: 18px 0 6px; }
  .doclist a { display: block; padding: 4px 8px; border-radius: 6px; color: var(--ink); text-decoration: none;
               font-size: 13px; }
  .doclist a:hover { background: var(--code); }
  .doclist a.active { background: var(--panel); border: 1px solid var(--line); }

  .doc { margin-top: 20px; min-width: 0; max-width: 900px; line-height: 1.6; }
  .doc h1 { font-size: 22px; margin: 0 0 8px; }
  .doc h2 { font-size: 17px; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 32px 0 8px; }
  .doc h3 { font-size: 15px; margin: 22px 0 6px; }
  .doc a { color: var(--accent); }
  .doc code { background: var(--code); border-radius: 4px; padding: 1px 5px; }
  .doc pre { background: var(--code); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
  .doc pre code { padding: 0; background: none; }
  .doc table { border-collapse: collapse; display: block; overflow-x: auto; margin: 12px 0; font-size: 13px; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .doc th { background: var(--panel); }
  .doc .mermaid { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
                  margin: 14px 0; overflow-x: auto; text-align: center; }
  .doc .mermaid { cursor: zoom-in; position: relative; }
  .doc .mermaid svg { max-width: 100%; height: auto; }            /* fit the page by default */
  .doc .mermaid.zoomed { cursor: zoom-out; }
  .doc .mermaid.zoomed svg { max-width: none; }                    /* click: full size, scroll */
  .doc .mermaid::after { content: "click to enlarge"; position: absolute; right: 12px; bottom: 8px;
                         font-size: 11px; color: var(--muted); }
  .doc .mermaid.zoomed::after { content: "click to fit"; }
  .doc.wide { max-width: none; }

  .walk { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; margin-top: 20px; }
  @media (max-width: 760px) { .walk { grid-template-columns: 1fr; } .walk-list { order: 2; } }
  .walk-list a { display: block; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none;
                 border: 1px solid transparent; margin-bottom: 2px; }
  .walk-list a:hover { background: var(--code); }
  .walk-list a.active { background: var(--panel); border-color: var(--line); }
  .walk-list .num { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  .walk-list .count { display: block; font-size: 12px; color: var(--muted); margin-left: 20px; }
  .walk-case h2 { font-size: 20px; text-transform: none; letter-spacing: -0.01em; color: var(--ink); margin: 0 0 4px; }
  .walk-case > .desc { margin-bottom: 16px; }
  .stepper { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .stepper a { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
               color: var(--muted); text-decoration: none; background: var(--panel); }
  .stepper a:hover { border-color: var(--accent); color: var(--ink); }
  .stepper a.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px;
          display: flex; flex-direction: column; gap: 12px; }
  .step-count { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  .step h3 { font-size: 17px; margin: 0; }
  .step-body p { margin: 0; }
  .step-body code, .step-expect code { background: var(--code); border-radius: 4px; padding: 1px 5px; }
  .step-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .step-expect { border-left: 3px solid var(--accent); padding-left: 10px; }
  .step-links { display: flex; flex-wrap: wrap; gap: 8px; }
  .step-link { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 8px;
               border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 13px; }
  .step-link:hover { border-color: var(--accent); }
  .step-link .kind { color: var(--muted); font-size: 12px; }
  .step-note { font-size: 12px; color: var(--muted); margin: 0; }
  .shot { margin: 0; }
  .shot a { display: block; }
  .shot img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; }
  .shot figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .shot-missing { border: 1px dashed var(--line); border-radius: 8px; padding: 18px; color: var(--muted);
                  font-size: 13px; text-align: center; background: var(--code); }
  .step-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }
  .step-nav a { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
                color: var(--ink); text-decoration: none; font-weight: 600; font-size: 13px; }
  .step-nav a:hover { border-color: var(--accent); }
  .step-nav a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .step-nav .spacer { flex: 1; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>
<script src="https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
const { useEffect, useState } = React;
const html = htm.bind(React.createElement);
const ROOT = "C:\\projects\\test\\mini-payments-platform";

// The service list lives in services.json, shared with the status collector (portal/status.py),
// which checks every service every 30 s server-side and keeps the history.
function useServices() {
  const [groups, setGroups] = useState([]);
  useEffect(() => {
    fetch("/services.json").then(r => r.json()).then(config => {
      const fill = text => text && text.replaceAll("{ROOT}", ROOT);
      setGroups(config.groups.map(g => ({ ...g, services: g.services.map(s =>
        ({ ...s, start: fill(s.start), address: fill(s.address) })) })));
    }).catch(() => setGroups([]));
  }, []);
  return groups;
}

function useStatuses() {
  const [data, setData] = useState({ services: {} });
  useEffect(() => {
    let stopped = false;
    const load = () => fetch("/status/current").then(r => r.json())
      .then(d => !stopped && setData(d)).catch(() => {});
    load();
    const id = setInterval(load, 15000);
    return () => { stopped = true; clearInterval(id); };
  }, []);
  return data;
}

function timeAgo(ts) {
  const seconds = Math.max(0, Math.round(Date.now() / 1000 - ts));
  return seconds < 90 ? `${seconds}s ago` : `${Math.round(seconds / 60)} min ago`;
}

function Copy({ text }) {
  const [label, setLabel] = useState("Copy");
  const copy = async () => {
    try { await navigator.clipboard.writeText(text); setLabel("Copied"); }
    catch { setLabel("Blocked: select the text"); }  // clipboard needs http://localhost, not file://
    setTimeout(() => setLabel("Copy"), 2000);
  };
  return html`<button onClick=${copy} title="Copy command">${label}</button>`;
}

function stateOf(service, status) {
  if (!status) return "checking";
  if (status.up) return "up";
  return service.on_demand ? "idle" : "down";
}

function ServiceCard({ service, status, store }) {
  const state = stateOf(service, status);
  const label = { up: `running · ${Math.round(status?.latency_ms ?? 0)} ms`, down: "not running",
                  idle: "not running (on demand)", checking: "checking…" }[state];
  return html`
    <div class="card">
      <div class="top">
        <span class=${"dot " + state} title=${status?.error || ""}></span>
        <span class="name">${store || !service.url ? service.name
          : html`<a href=${service.url} target="_blank" rel="noopener">${service.name}</a>`}</span>
        <span class="state">${label}</span>
      </div>
      ${store && html`<div class="cmd"><span>${service.address}</span><${Copy} text=${service.address} /></div>`}
      <p class="desc">${service.desc}</p>
      ${!store && html`<div class="links">
        <a href=${service.url} target="_blank" rel="noopener">${service.url.replace("http://", "")}</a>
        ${(service.links || []).map(([text, href]) => html`<a key=${href} href=${href} target="_blank" rel="noopener">${text}</a>`)}
      </div>`}
      ${(state === "down" || state === "idle") && service.start &&
        html`<div class="cmd"><span>${service.start}</span><${Copy} text=${service.start} /></div>`}
    </div>`;
}

// ---------- status history (portal/status.py via /status/history) ----------

const RANGES = [["1h", "1 hour"], ["24h", "24 hours"], ["7d", "7 days"]];

function bucketClass(bucket, onDemand) {
  if (!bucket) return "none";
  if (bucket.up === bucket.checks) return "up";
  if (onDemand) return "off";   // off is the normal state for on-demand tools, not an outage
  return bucket.up === 0 ? "down" : "partial";
}

function formatTime(ts, range) {
  const date = new Date(ts * 1000);
  return range === "7d" ? date.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" })
                        : date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function StatusView({ groups }) {
  const [range, setRange] = useState(() => { try { return localStorage.getItem("status-range") || "24h"; } catch { return "24h"; } });
  const [data, setData] = useState(null);
  const [hover, setHover] = useState(null);
  useEffect(() => {
    try { localStorage.setItem("status-range", range); } catch {}
    let stopped = false;
    const load = () => fetch(`/status/history?range=${range}`).then(r => r.json())
      .then(d => !stopped && setData(d)).catch(() => {});
    load();
    const id = setInterval(load, 30000);
    return () => { stopped = true; clearInterval(id); };
  }, [range]);

  const checked = groups.map(g => ({ ...g, services: g.services.filter(s => s.check) })).filter(g => g.services.length);
  return html`
    <div class="status">
      <div class="status-controls">
        <div class="segmented" role="group" aria-label="Time range">
          ${RANGES.map(([key, label]) => html`
            <button key=${key} class=${range === key ? "active" : ""} onClick=${() => setRange(key)}>${label}</button>`)}
        </div>
        <div class="legend">
          <span><i class="sw up"></i>Up</span><span><i class="sw partial"></i>Partly down</span>
          <span><i class="sw down"></i>Down</span><span><i class="sw off"></i>Off (on-demand tools)</span><span><i class="sw none"></i>No data</span>
        </div>
      </div>
      ${!data ? html`<p class="desc">Loading history…</p>` : checked.map(group => html`
        <section key=${group.title}>
          <h2>${group.title}</h2>
          ${group.services.map(service => {
            const history = data.services[service.name];
            const buckets = history ? history.buckets : Array(data.bars).fill(null);
            const uptime = history && history.uptime !== null
              ? `${(history.uptime * 100).toFixed(history.uptime < 1 ? 1 : 0)}%` : "–";
            return html`
              <div class="status-row" key=${service.name}>
                <div class="status-name">${service.name}${service.on_demand ? html` <span class="tag">on demand</span>` : ""}</div>
                <div class="bars" onMouseLeave=${() => setHover(null)}>
                  ${buckets.map((bucket, i) => html`
                    <span key=${i} class=${"bar " + bucketClass(bucket, service.on_demand)}
                      aria-label=${`${service.name}, ${formatTime(data.start + i * data.bucket_seconds, range)}: ${bucket ? `${bucket.up} of ${bucket.checks} checks up` : "no data"}`}
                      onMouseEnter=${e => setHover({ service: service.name, bucket, i, x: e.clientX, y: e.clientY })}
                      onMouseMove=${e => setHover(h => h && { ...h, x: e.clientX, y: e.clientY })}></span>`)}
                </div>
                <div class="uptime">${uptime}</div>
              </div>`;
          })}
        </section>`)}
      ${data && html`<div class="axis"><span>${formatTime(data.start, range)}</span><span>now</span></div>`}
      ${hover && data && html`
        <div class="tooltip" style=${{ left: hover.x + 12, top: hover.y + 12 }}>
          <b>${hover.service}</b>
          <div>${formatTime(data.start + hover.i * data.bucket_seconds, range)} – ${formatTime(data.start + (hover.i + 1) * data.bucket_seconds, range)}</div>
          <div>${hover.bucket ? `${hover.bucket.up} of ${hover.bucket.checks} checks up` : "no checks in this period"}</div>
          ${hover.bucket && hover.bucket.error && html`<div class="tooltip-error">${hover.bucket.error}</div>`}
        </div>`}
      <footer>Checked every 30 s by the portal server (portal/status.py); history kept 7 days in portal/data/status.db.</footer>
    </div>`;
}

// ---------- docs (served read-only from docs/ by portal/serve.py) ----------

const DARK = window.matchMedia("(prefers-color-scheme: dark)").matches;
// Mermaid measures label text to size boxes; give it the page's font or titles overflow.
const PAGE_FONT = 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif';
mermaid.initialize({
  startOnLoad: false, securityLevel: "strict", theme: DARK ? "dark" : "neutral",
  fontFamily: PAGE_FONT, themeVariables: { fontFamily: PAGE_FONT, fontSize: "14px" },
});

function resolvePath(base, href) {
  const parts = base.split("/").slice(0, -1);
  for (const part of href.split("/")) {
    if (part === "..") parts.pop(); else if (part !== ".") parts.push(part);
  }
  return parts.join("/");
}

// Render a docs/ Markdown file: internal .md links stay in the portal, links to code files
// (which the server doesn't serve) become plain paths, and mermaid blocks become diagrams.
function DocView({ path, wide = false }) {
  const [state, setState] = useState({ status: "loading", html: "" });
  const ref = React.useRef(null);
  useEffect(() => {
    let cancelled = false;
    setState({ status: "loading", html: "" });
    fetch(`/docs/${path}`)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
      .then(md => !cancelled && setState({ status: "ok", html: marked.parse(md) }))
      .catch(e => !cancelled && setState({ status: "error", html: String(e) }));
    return () => { cancelled = true; };
  }, [path]);
  useEffect(() => {
    const root = ref.current;
    if (!root || state.status !== "ok") return;
    root.querySelectorAll("a[href]").forEach(a => {
      const href = a.getAttribute("href");
      if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
      if (href.startsWith("#")) return;
      const [file] = href.split("#");
      if (file.endsWith(".md")) { a.setAttribute("href", `#docs/${resolvePath(path, file)}`); return; }
      const code = document.createElement("code");
      code.textContent = a.textContent;
      code.title = `In the repository: ${resolvePath("docs/" + path, file)}`;
      a.replaceWith(code);
    });
    const blocks = [...root.querySelectorAll("pre > code.language-mermaid")].map(code => {
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
      return div;
    });
    blocks.forEach(div => div.addEventListener("click", () => div.classList.toggle("zoomed")));
    if (blocks.length) mermaid.run({ nodes: blocks }).catch(e => console.error("mermaid", e));
    window.scrollTo(0, 0);
  }, [state]);
  if (state.status === "loading") return html`<p class="desc">Loading ${path}…</p>`;
  if (state.status === "error") return html`<p class="desc">Couldn't load docs/${path} (${state.html}). Is the portal running through <code>portal/serve.py</code>?</p>`;
  return html`<article class=${"doc" + (wide ? " wide" : "")} ref=${ref} dangerouslySetInnerHTML=${{ __html: state.html }}></article>`;
}

function DocsView({ path }) {
  const [index, setIndex] = useState([]);
  useEffect(() => { fetch("/docs/index.json").then(r => r.json()).then(setIndex).catch(() => setIndex([])); }, []);
  const groups = [...new Set(index.map(d => d.group))];
  const current = path || "governance.md";
  return html`
    <div class="docs">
      <nav class="doclist">
        ${groups.map(g => html`
          <div key=${g}>
            <h2>${g}</h2>
            ${index.filter(d => d.group === g).map(d => html`
              <a key=${d.path} href=${"#docs/" + d.path} class=${d.path === current ? "active" : ""}>${d.title}</a>`)}
          </div>`)}
      </nav>
      <${DocView} path=${current} />
    </div>`;
}

// ---------- walkthrough (use cases from walkthrough.json, screenshots from e2e/capture.py) ----------

function useWalkthrough() {
  const [data, setData] = useState({ cases: null, captured: new Set() });
  useEffect(() => {
    // walkthrough/index.json lists the screenshots e2e/capture.py has taken, so the page never
    // requests one that doesn't exist.
    Promise.all([fetch("/walkthrough.json").then(r => r.json()),
                 fetch("/walkthrough/index.json").then(r => r.json()).catch(() => ({ screenshots: [] }))])
      .then(([walkthrough, index]) => setData({ cases: walkthrough.use_cases, captured: new Set(index.screenshots) }))
      .catch(() => setData({ cases: [], captured: new Set() }));
  }, []);
  return data;
}

// A link names a service (resolved through services.json, so it follows the environment), a doc,
// or a portal tab.
function resolveLink(link, services) {
  if (link.portal) return { href: link.portal, kind: "portal" };
  if (link.doc) return { href: `#docs/${link.doc}`, kind: "doc" };
  const service = services[link.service];
  if (!service) return { missing: true };
  return { href: link.path ? new URL(link.path, service.url).href : service.url, kind: "app", service, external: true };
}

const inline = text => ({ __html: marked.parseInline(text || "") });

function Screenshot({ src, alt, captured }) {
  const [missing, setMissing] = useState(!captured);
  if (missing) return html`
    <div class="shot-missing">No screenshot yet. Capture it with <code>e2e/.venv/Scripts/python e2e/capture.py</code>${" "}while the service is running.</div>`;
  return html`
    <figure class="shot">
      <a href=${src} target="_blank" rel="noopener" title="Open full size"><img src=${src} alt=${alt} loading="lazy" onError=${() => setMissing(true)} /></a>
      <figcaption>${alt}</figcaption>
    </figure>`;
}

function WalkthroughView({ route, groups, statuses }) {
  const { cases, captured } = useWalkthrough();
  const [, caseId, stepId] = route.split("/");
  const services = Object.fromEntries(groups.flatMap(g => g.services).map(s => [s.name, s]));
  const flat = (cases || []).flatMap((c, ci) => c.steps.map((s, si) => ({ c, s, ci, si })));
  const index = Math.max(0, flat.findIndex(({ c, s }) => c.id === caseId && (!stepId || s.id === stepId)));
  const here = flat[index];
  const hrefOf = item => item && `#walkthrough/${item.c.id}/${item.s.id}`;
  const prev = hrefOf(flat[index - 1]), next = hrefOf(flat[index + 1]);

  // One listener that moves its own position, so presses faster than React re-renders still count.
  const nav = React.useRef({});
  nav.current = { ids: flat.map(hrefOf), index };
  useEffect(() => { window.scrollTo(0, 0); }, [index]);
  useEffect(() => {
    const onKey = e => {
      if (e.altKey || e.ctrlKey || e.metaKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
      const target = step && nav.current.ids[nav.current.index + step];
      if (!target) return;
      nav.current.index += step;
      window.location.hash = target;
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  if (cases === null) return html`<p class="desc">Loading the walkthrough…</p>`;
  if (!here) return html`<p class="desc">No use cases found in walkthrough.json.</p>`;
  const { c, s, ci, si } = here;
  const links = (s.links || []).map(link => ({ link, ...resolveLink(link, services) })).filter(l => !l.missing);
  const down = links.filter(l => l.service && stateOf(l.service, statuses[l.service.name]) !== "up" && statuses[l.service.name]);
  const nextCase = si === c.steps.length - 1 && flat[index + 1];
  return html`
    <div class="walk">
      <nav class="walk-list" aria-label="Use cases">
        ${cases.map((uc, i) => html`
          <a key=${uc.id} href=${`#walkthrough/${uc.id}/${uc.steps[0].id}`} class=${uc.id === c.id ? "active" : ""}>
            <span class="num">${i + 1}.</span>${uc.title}
            <span class="count">${uc.steps.length} steps</span>
          </a>`)}
      </nav>
      <div class="walk-case">
        <h2>${c.title}</h2>
        <p class="desc">${c.summary}</p>
        <div class="stepper" role="list">
          ${c.steps.map((step, i) => html`
            <a key=${step.id} role="listitem" href=${`#walkthrough/${c.id}/${step.id}`} class=${i === si ? "active" : ""}
               aria-current=${i === si ? "step" : undefined}>${i + 1}. ${step.title}</a>`)}
        </div>
        <article class="step" data-step=${`${c.id}/${s.id}`}>
          <div class="step-count">Use case ${ci + 1} of ${cases.length} · step ${si + 1} of ${c.steps.length}</div>
          <h3>${s.title}</h3>
          <p class="step-body" dangerouslySetInnerHTML=${inline(s.body)}></p>
          ${s.run && html`<div><div class="step-label">Run, from the project folder</div>
            <div class="cmd"><span>${s.run}</span><${Copy} text=${s.run} /></div></div>`}
          ${s.expect && html`<div class="step-expect"><div class="step-label">What you should see</div>
            <span dangerouslySetInnerHTML=${inline(s.expect)}></span></div>`}
          ${links.length > 0 && html`<div class="step-links">
            ${links.map(({ link, href, kind, service, external }) => html`
              <a key=${href} class="step-link" href=${href} target=${external ? "_blank" : undefined} rel=${external ? "noopener" : undefined}>
                ${service && html`<span class=${"dot " + stateOf(service, statuses[service.name])}></span>`}
                ${link.label}<span class="kind">${{ app: service?.name, doc: "doc", portal: "portal" }[kind]}</span>
              </a>`)}
          </div>`}
          ${down.length > 0 && html`<p class="step-note">
            ${down.map(l => l.service.name).join(", ")} ${down.length > 1 ? "aren't" : "isn't"} running here; start it from the${" "}<a href="#services">Services</a>${" "}tab${s.screenshot ? ", or use the screenshot below" : ""}.</p>`}
          ${s.screenshot && html`<${Screenshot} key=${`${c.id}/${s.id}`} src=${`walkthrough/${c.id}/${s.id}.png`}
            captured=${captured.has(`${c.id}/${s.id}`)} alt=${s.screenshot.alt || s.title} />`}
        </article>
        <div class="step-nav">
          ${prev ? html`<a href=${prev}>← Back</a>` : html`<span></span>`}
          <span class="spacer"></span>
          ${next ? html`<a class="primary" href=${next}>${nextCase ? `Next: ${nextCase.c.title} →` : "Next →"}</a>`
                 : html`<a href="#docs">Done: browse the docs →</a>`}
        </div>
        <footer>Use the arrow keys to move between steps. Steps live in <code>portal/walkthrough.json</code>.</footer>
      </div>
    </div>`;
}

function useRoute() {
  const read = () => window.location.hash.replace(/^#/, "") || "walkthrough";
  const [route, setRoute] = useState(read);
  useEffect(() => {
    const onChange = () => setRoute(read());
    window.addEventListener("hashchange", onChange);
    return () => window.removeEventListener("hashchange", onChange);
  }, []);
  return route;
}

function App() {
  const route = useRoute();
  const groups = useServices();
  const status = useStatuses();
  const checked = groups.flatMap(g => g.services).filter(s => s.check);
  const up = checked.filter(s => stateOf(s, status.services[s.name]) === "up").length;
  const latest = Math.max(0, ...Object.values(status.services).map(s => s.ts));
  const tab = route.startsWith("docs") ? "docs" : route.startsWith("walkthrough") ? "walkthrough"
            : ["architecture", "status"].includes(route) ? route : "services";
  return html`
    <main>
      <header>
        <h1>Payments platform · local</h1>
        <span class="summary">
          ${latest ? html`<b>${up}</b> of ${checked.length} services up · checked ${timeAgo(latest)}` : "waiting for the first check…"}
        </span>
      </header>
      <nav class="tabs">
        <a href="#walkthrough" class=${tab === "walkthrough" ? "active" : ""}>Walkthrough</a>
        <a href="#services" class=${tab === "services" ? "active" : ""}>Services</a>
        <a href="#status" class=${tab === "status" ? "active" : ""}>Status</a>
        <a href="#architecture" class=${tab === "architecture" ? "active" : ""}>Architecture</a>
        <a href="#docs" class=${tab === "docs" ? "active" : ""}>Docs</a>
      </nav>
      ${tab === "walkthrough" && html`<${WalkthroughView} route=${route} groups=${groups} statuses=${status.services} />`}
      ${tab === "architecture" && html`<${DocView} path="architecture.md" wide=${true} />`}
      ${tab === "docs" && html`<${DocsView} path=${route.replace(/^docs\/?/, "")} />`}
      ${tab === "status" && html`<${StatusView} groups=${groups} />`}
      ${tab === "services" && html`<${ServicesView} groups=${groups} statuses=${status.services} />`}
    </main>`;
}

function ServicesView({ groups, statuses }) {
  return html`
    <div>
      ${groups.map(group => html`
        <section key=${group.title}>
          <h2>${group.title}</h2>
          <div class="grid">
            ${group.services.map(s => html`<${ServiceCard} key=${s.name} service=${s} status=${statuses[s.name]} store=${group.kind === "store"} />`)}
          </div>
        </section>`)}
      <footer>
        Status comes from the portal server, which checks every service every 30 s; the Status tab
        shows the history. Serve the portal with <code>uv run python portal/serve.py</code> from the
        project folder and open http://localhost:8099.
      </footer>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>

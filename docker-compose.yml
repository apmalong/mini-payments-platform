# Services grouped by profile so each module only starts what it needs.
# Airflow runs from its own compose file: see orchestration/README.md.
services:
  postgres:
    image: postgres:16
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redpanda:
    image: redpandadata/redpanda:latest
    profiles: [streaming]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      # internal listener for other containers (console), external for host clients
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
      - --schema-registry-addr=0.0.0.0:8081
    ports: ["9092:9092", "18081:8081", "9644:9644"]   # 8081 is used by dbt docs

  redpanda-console:
    image: redpandadata/console:latest
    profiles: [streaming]
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports: ["8085:8080"]   # 8082 is reserved by Windows

  redis:
    image: redis:7
    profiles: [streaming, ml]
    ports: ["6379:6379"]

  redisinsight:
    image: redis/redisinsight:latest
    profiles: [streaming, ml]
    ports: ["5540:5540"]   # add database: host redis, port 6379

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    profiles: [ml]
    # Artifacts are proxied by the server (--serve-artifacts), so clients need no shared disk or S3.
    # --allowed-hosts: MLflow 3 rejects unknown Host headers (DNS-rebinding protection);
    # host.docker.internal is how the Airflow container reaches it.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,host.docker.internal,host.docker.internal:5000,mlflow,mlflow:5000
    ports: ["5000:5000"]
    volumes: [mlflowdata:/mlflow]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: [gateway]
    command: --config /app/config.yaml --port 4000
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes: [./gateway/litellm_config.yaml:/app/config.yaml:ro]
    ports: ["4000:4000"]

  prometheus:
    image: prom/prometheus:latest
    profiles: [obs]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes: [./observability/grafana/dashboards:/var/lib/grafana/dashboards]
    ports: ["3000:3000"]

volumes:
  pgdata:
  mlflowdata:

name: ci
on: [pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff -r warehouse/dbt/requirements.txt
      - run: ruff check .
      - run: cd warehouse/dbt && dbt deps --profiles-dir . && dbt build --profiles-dir .
      # TODO(Module 11): slim CI with --select state:modified+ --defer --state <prod manifest>
      - run: python governance/check_pii.py

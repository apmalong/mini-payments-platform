apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "fraud-scorer.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "fraud-scorer.selector" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never go below the current capacity during a rollout
      maxSurge: 1
  template:
    metadata:
      labels: {{- include "fraud-scorer.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        rollout-id: {{ .Values.rolloutId | quote }}
        # Picked up by the in-cluster Prometheus (kubernetes-pods job).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics/
    spec:
      terminationGracePeriodSeconds: 20
      tolerations:
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute,
           tolerationSeconds: {{ .Values.nodeFailureToleranceSeconds }}}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute,
           tolerationSeconds: {{ .Values.nodeFailureToleranceSeconds }}}
      # Spread replicas across nodes so one node failure can't take them all. Hard rule: a soft one
      # let a rollout put both replicas on one node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor   # a failed (tainted) node is not a place to spread to
          matchLabelKeys: [pod-template-hash]   # balance each revision's pods, ignoring old ones mid-rollout
          labelSelector:
            matchLabels: {{- include "fraud-scorer.selector" . | nindent 14 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: scorer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}   # MLflow downloads the model here
          # Traffic only once the model is loaded.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            failureThreshold: 2
          # Restart only if the process stops responding; loading a model can take a while.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
          lifecycle:
            # Keep serving while the endpoint is removed from the Service, so in-flight
            # routing doesn't hit a terminating pod.
            preStop:
              sleep: {seconds: 5}
      volumes:
        - name: tmp
          emptyDir: {}

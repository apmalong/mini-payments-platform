image:
  repository: fraud-scorer
  tag: local            # kind load docker-image fraud-scorer:local --name payments
  pullPolicy: IfNotPresent

# Dependencies run outside the cluster, on the Docker host.
mlflowTrackingUri: http://host.docker.internal:5000
redisHost: host.docker.internal

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

replicaCount: 2         # used only when autoscaling is disabled

service:
  nodePort: 30080       # kind maps it to localhost:8091 (k8s/kind.yaml)

# Change to force a rolling restart without a new image (the zero-downtime test uses this).
rolloutId: "1"

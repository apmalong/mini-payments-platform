image:
  repository: fraud-scorer
  tag: m9               # docker build -f ml/serve/Dockerfile -t fraud-scorer:m9 . ; kind load docker-image fraud-scorer:m9 --name payments
  pullPolicy: IfNotPresent

# Dependencies run outside the cluster, on the Docker host.
mlflowTrackingUri: http://host.docker.internal:5000
redisHost: host.docker.internal

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

replicaCount: 2         # used only when autoscaling is disabled

service:
  nodePort: 30080       # kind maps it to localhost:8091 (k8s/kind.yaml)

# How long pods stay bound to a node that has stopped responding before being rescheduled.
# Kubernetes' default is 300s; a scorer in the payment path shouldn't wait five minutes.
nodeFailureToleranceSeconds: 30

# Change to force a rolling restart without a new image (the zero-downtime test uses this).
rolloutId: "1"
